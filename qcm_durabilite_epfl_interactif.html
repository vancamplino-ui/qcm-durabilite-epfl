<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM Durabilité EPFL</title>
    <style>
:root {
  --bg: #f6f7fb;
  --card: #fff;
  --text: #202124;
  --muted: #667085;
  --blue: #2563eb;
  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  position: sticky;
  top: 0;
  background: #111827;
  color: white;
  padding: 18px 22px;
  z-index: 2;
  box-shadow: 0 4px 20px #0002;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.headerTop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

header p {
  margin: 6px 0 0;
  color: #d1d5db;
}

.mobileToggle {
  display: none;
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 9px 12px;
  background: #1f2937;
  color: white;
  font-weight: 700;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

select,
button,
input {
  font: inherit;
}

select,
input {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  min-width: 220px;
}

main {
  max-width: 1000px;
  margin: 24px auto;
  padding: 0 16px 60px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 4px 16px #0000000d;
}

.stat b {
  font-size: 26px;
}

.stat span {
  display: block;
  color: var(--muted);
  margin-top: 3px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px;
  margin: 18px 0;
  box-shadow: 0 8px 24px #0000000d;
}

.sectionTitle {
  margin: 30px 0 12px;
  font-size: 24px;
  font-weight: 800;
  color: #111827;
}

.sectionTitle.testSection {
  margin-top: 36px;
  color: #1d4ed8;
}

.meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 8px;
}

.question {
  font-size: 19px;
  font-weight: 750;
  line-height: 1.35;
  margin: 10px 0 16px;
}

.choice {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  margin: 9px 0;
  cursor: pointer;
  background: #fafafa;
}

.choice:hover {
  background: #f3f4f6;
}

.choice input {
  min-width: auto;
  margin-top: 3px;
}

.actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.btn {
  border: 0;
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 700;
}

.verify {
  background: var(--blue);
  color: white;
}

.reset {
  background: #e5e7eb;
  color: #111827;
}

.feedback {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 14px;
  font-weight: 700;
  display: none;
}

.good {
  background: #dcfce7;
  color: #166534;
  border: 1px solid #86efac;
}

.bad {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fecaca;
}

.explain {
  font-weight: 400;
  margin-top: 8px;
  color: #374151;
  line-height: 1.45;
}

.correctChoice {
  border-color: #86efac;
  background: #f0fdf4;
}

.wrongChoice {
  border-color: #fecaca;
  background: #fef2f2;
}

.missedChoice {
  border-color: #fde68a;
  background: #fffbeb;
}

.errorNav {
  position: fixed;
  top: 50%;
  right: 18px;
  transform: translateY(-50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 8px;
  border: 1px solid #fecaca;
  border-radius: 999px;
  background: #ffffffee;
  box-shadow: 0 8px 24px #00000014;
  backdrop-filter: blur(8px);
}

.errorNav[hidden] {
  display: none;
}

.errorNavTitle {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #b91c1c;
}

.errorNavList {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.errorNavDot {
  width: 14px;
  height: 14px;
  border: 0;
  border-radius: 4px;
  background: #dc2626;
  box-shadow: inset 0 0 0 1px #ffffffaa;
  cursor: pointer;
}

.errorNavDot:hover,
.errorNavDot:focus-visible {
  background: #b91c1c;
  outline: 2px solid #fecaca;
  outline-offset: 2px;
}

@media (max-width: 700px) {
  header {
    padding: 14px 16px;
  }

  header h1 {
    font-size: 20px;
  }

  header p {
    font-size: 14px;
    line-height: 1.4;
  }

  .mobileToggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .headerPanel {
    display: none;
    margin-top: 10px;
  }

  .headerPanel.open {
    display: block;
  }

  .controls {
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .controls > * {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  select,
  input,
  .controls .btn {
    min-width: 0;
  }

  .errorNav {
    right: 10px;
    padding: 8px 6px;
  }

  .errorNavTitle {
    font-size: 10px;
  }

  .errorNavDot {
    width: 12px;
    height: 12px;
  }
}
    </style>
  </head>
  <body>
    <header>
      <div class="headerTop">
        <h1>QCM Durabilité EPFL</h1>
        <button
          id="mobileToggle"
          class="mobileToggle"
          type="button"
          aria-expanded="false"
        >
          Filtres
        </button>
      </div>
      <div id="headerPanel" class="headerPanel">
        <p>
          Coche les bonnes réponses puis clique sur <b>Vérifier</b> après chaque
          question.
        </p>
        <div class="controls">
          <select id="weekFilter">
            <option value="all">Toutes les semaines</option>
          </select>
          <input id="search" placeholder="Rechercher une question...">
          <button class="btn reset" onclick="resetAll()">Réinitialiser</button>
        </div>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat">
          <b id="total">0</b>
          <span>questions affichées</span>
        </div>
        <div class="stat">
          <b id="done">0</b>
          <span>questions vérifiées</span>
        </div>
        <div class="stat">
          <b id="score">0%</b>
          <span>score actuel</span>
        </div>
      </div>

      <div id="quiz"></div>
    </main>

    <aside id="errorNav" class="errorNav" hidden aria-label="Questions fausses">
      <span class="errorNavTitle">Fautes</span>
      <div id="errorNavList" class="errorNavList"></div>
    </aside>

const state = new Map();
const quiz = document.getElementById('quiz');
const weekFilter = document.getElementById('weekFilter');
const search = document.getElementById('search');
const headerPanel = document.getElementById('headerPanel');
const mobileToggle = document.getElementById('mobileToggle');
const errorNav = document.getElementById('errorNav');
const errorNavList = document.getElementById('errorNavList');

[...new Set(QUESTIONS.map((q) => q.week).filter(Boolean))].forEach((week) => {
  const option = document.createElement('option');
  option.value = week;
  option.textContent = week;
  weekFilter.appendChild(option);
});

weekFilter.addEventListener('change', render);
search.addEventListener('input', render);

mobileToggle.addEventListener('click', toggleHeaderPanel);

syncHeaderPanel();

window.addEventListener('resize', syncHeaderPanel);

function isMobileLayout() {
  return window.innerWidth <= 700;
}

function toggleHeaderPanel() {
  if (!isMobileLayout()) {
    return;
  }

  headerPanel.classList.toggle('open');
  const isOpen = headerPanel.classList.contains('open');
  mobileToggle.setAttribute('aria-expanded', String(isOpen));
  mobileToggle.textContent = isOpen ? 'Fermer' : 'Filtres';
}

function syncHeaderPanel() {
  if (isMobileLayout()) {
    const isOpen = headerPanel.classList.contains('open');
    mobileToggle.setAttribute('aria-expanded', String(isOpen));
    mobileToggle.textContent = isOpen ? 'Fermer' : 'Filtres';
    return;
  }

  headerPanel.classList.remove('open');
  mobileToggle.setAttribute('aria-expanded', 'false');
  mobileToggle.textContent = 'Filtres';
}

function filtered() {
  const selectedWeek = weekFilter.value;
  const searchText = search.value.toLowerCase().trim();

  return QUESTIONS.filter((q) => {
    const matchesWeek = selectedWeek === 'all' || q.week === selectedWeek;
    const haystack = (q.question + ' ' + (q.displayId || q.id) + ' ' + q.week).toLowerCase();
    const matchesSearch = !searchText || haystack.includes(searchText);

    return matchesWeek && matchesSearch;
  });
}

function render() {
  quiz.innerHTML = '';

  const list = filtered();
  document.getElementById('total').textContent = list.length;

  let currentSection = '';

  list.forEach((q) => {
    if (q.section && q.section !== currentSection) {
      const title = document.createElement('div');
      title.className = 'sectionTitle';
      if (q.section === 'QCM TEST') {
        title.classList.add('testSection');
      }
      title.textContent = q.section;
      quiz.appendChild(title);
      currentSection = q.section;
    }

    quiz.appendChild(card(q));
  });
  updateStats();
  updateErrorNav();
}

function card(q) {
  const labelId = q.displayId || q.id;
  const metaLabel = q.metaWeek || q.week || '';
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'q-' + q.id.replaceAll('.', '-');
  div.innerHTML = `
    <div class="meta">
      <span>${escapeHtml(metaLabel)}</span>
      <span>Question ${escapeHtml(labelId)}</span>
    </div>
    <div class="question">${escapeHtml(q.question)}</div>
    <div class="choices">
      ${q.choices
        .map(
          (c, i) => `
            <label class="choice">
              <input type="checkbox" data-q="${q.id}" data-i="${i}">
              <span>${escapeHtml(c.text)}</span>
            </label>
          `
        )
        .join('')}
    </div>
    <div class="actions">
      <button class="btn verify" onclick="verify('${q.id}')">
        Vérifier
      </button>
      <button class="btn reset" onclick="resetQuestion('${q.id}')">
        Effacer
      </button>
    </div>
    <div class="feedback" id="fb-${q.id.replaceAll('.', '-')}"></div>
  `;

  return div;
}

function verify(id) {
  const q = QUESTIONS.find((item) => item.id === id);
  const cardElement = document.getElementById('q-' + id.replaceAll('.', '-'));
  const inputs = [...cardElement.querySelectorAll('input[type=checkbox]')];
  let ok = true;

  inputs.forEach((input) => {
    const index = Number(input.dataset.i);
    const label = input.closest('.choice');

    label.classList.remove('correctChoice', 'wrongChoice', 'missedChoice');

    if (input.checked && q.choices[index].correct) {
      label.classList.add('correctChoice');
    }

    if (input.checked && !q.choices[index].correct) {
      label.classList.add('wrongChoice');
      ok = false;
    }

    if (!input.checked && q.choices[index].correct) {
      label.classList.add('missedChoice');
      ok = false;
    }
  });

  const feedback = document.getElementById('fb-' + id.replaceAll('.', '-'));
  feedback.style.display = 'block';
  feedback.className = 'feedback ' + (ok ? 'good' : 'bad');
  feedback.innerHTML =
    (ok ? '✅ Correct' : '❌ Pas encore')
    + `<div class="explain"><b>Réponse :</b> ${escapeHtml(
      q.answer || q.choices.filter((c) => c.correct).map((c) => c.text).join(' ; ')
    )}${
      q.justification
        ? '<br><b>Justification :</b> ' + escapeHtml(q.justification)
        : ''
    }</div>`;

  state.set(id, ok);
  updateStats();
  updateErrorNav();
}

function resetQuestion(id) {
  const cardElement = document.getElementById('q-' + id.replaceAll('.', '-'));

  if (!cardElement) {
    return;
  }

  cardElement.querySelectorAll('input').forEach((input) => {
    input.checked = false;
  });

  cardElement.querySelectorAll('.choice').forEach((label) => {
    label.classList.remove('correctChoice', 'wrongChoice', 'missedChoice');
  });

  const feedback = document.getElementById('fb-' + id.replaceAll('.', '-'));
  feedback.style.display = 'none';
  state.delete(id);
  updateStats();
  updateErrorNav();
}

function resetAll() {
  QUESTIONS.forEach((q) => resetQuestion(q.id));
  state.clear();
  updateStats();
  updateErrorNav();
}

function updateStats() {
  const visible = filtered().map((q) => q.id);
  const done = visible.filter((id) => state.has(id)).length;
  const good = visible.filter((id) => state.get(id) === true).length;

  document.getElementById('done').textContent = done;
  document.getElementById('score').textContent = done
    ? Math.round((100 * good) / done) + '%'
    : '0%';
}

function updateErrorNav() {
  const wrongQuestions = filtered().filter((q) => state.get(q.id) === false);

  errorNavList.innerHTML = '';
  errorNav.hidden = wrongQuestions.length === 0;

  wrongQuestions.forEach((q) => {
    const labelId = q.displayId || q.id;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'errorNavDot';
    button.title = 'Question ' + labelId;
    button.setAttribute('aria-label', 'Aller a la question ' + labelId);
    button.addEventListener('click', () => scrollToQuestion(q.id));
    errorNavList.appendChild(button);
  });
}

function scrollToQuestion(id) {
  const element = document.getElementById('q-' + id.replaceAll('.', '-'));

  if (!element) {
    return;
  }

  element.scrollIntoView({
    behavior: 'smooth',
    block: 'center'
  });
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>'"]/g, (char) => {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[char];
  });
}

render();
    </script>
  </body>
</html>
